<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Contador de paquetes</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--tx:#14171a;--mut:#667;--ok:#1a9d55;--bad:#d93025;--ac:#2d3277;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101216;--card:#1b1e24;--tx:#eef0f3;--mut:#9aa;--ok:#3ddc84;--bad:#ff6b5e;--ac:#8d93ff}}
:root[data-theme="dark"]{--bg:#101216;--card:#1b1e24;--tx:#eef0f3;--mut:#9aa;--ok:#3ddc84;--bad:#ff6b5e;--ac:#8d93ff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:12px;max-width:520px;margin:auto}
.card{background:var(--card);border-radius:16px;padding:12px;margin-bottom:12px}
.count{text-align:center;font-size:72px;font-weight:800;line-height:1}
.count small{display:block;font-size:14px;font-weight:500;color:var(--mut);margin-top:4px}
.cam{position:relative;border-radius:12px;overflow:hidden;background:#000;aspect-ratio:4/3}
video{width:100%;height:100%;object-fit:cover}
.msg{position:absolute;left:0;right:0;bottom:0;padding:10px;text-align:center;font-weight:700;color:#fff;background:rgba(0,0,0,.55)}
.cam.ok{outline:6px solid var(--ok)}.cam.bad{outline:6px solid var(--bad)}
.cam.bad .msg{background:var(--bad)}.cam.ok .msg{background:var(--ok)}
button{font:inherit;border:0;border-radius:12px;padding:12px 14px;background:var(--ac);color:#fff;font-weight:600}
button.g{background:transparent;color:var(--bad);border:1px solid var(--bad)}
.row{display:flex;gap:8px;margin-top:8px}.row>*{flex:1}
input{font:inherit;width:100%;padding:12px;border-radius:12px;border:1px solid var(--mut);background:var(--bg);color:var(--tx)}
ul{list-style:none;margin:0;padding:0;max-height:260px;overflow-y:auto}
li{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--bg);font-size:14px;word-break:break-all}
li b{color:var(--mut);min-width:28px}li span{flex:1}li a{color:var(--bad);font-weight:700}
.err{color:var(--bad);font-size:14px;margin:8px 0 0}
</style>
</head>
<body>
<div class="card"><div class="count" id="n">0<small>paquetes escaneados</small></div></div>

<div class="card">
  <div class="cam" id="cam"><video id="v" playsinline muted></video><div class="msg" id="msg">Toca “Iniciar cámara”</div></div>
  <div class="row"><button id="start">Iniciar cámara</button></div>
  <p class="err" id="err"></p>
  <div class="row"><input id="man" placeholder="Código manual (si no escanea)"><button id="add" style="flex:0 0 auto">Agregar</button></div>
</div>

<div class="card">
  <ul id="list"></ul>
  <div class="row"><button class="g" id="reset">Reiniciar conteo</button></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js"></script>
<script>
var KEY="paquetes_v1",codes=[],last="",lastT=0,stream=null,detector=null;
var $=function(i){return document.getElementById(i)};
try{codes=JSON.parse(localStorage.getItem(KEY)||"[]")}catch(e){codes=[]}
function save(){try{localStorage.setItem(KEY,JSON.stringify(codes))}catch(e){}}
function beep(f,d){try{var c=new (window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator();o.frequency.value=f;o.connect(c.destination);o.start();setTimeout(function(){o.stop();c.close()},d)}catch(e){}}
function flash(cls,t){var c=$("cam");c.className="cam "+cls;$("msg").textContent=t;setTimeout(function(){c.className="cam";$("msg").textContent="Escaneando…"},1200)}
function render(){
  $("n").firstChild.nodeValue=codes.length;
  $("list").innerHTML=codes.map(function(c,i){return "<li><b>"+(i+1)+"</b><span>"+c.replace(/</g,"&lt;")+"</span><a href='#' data-i='"+i+"'>✕</a></li>"}).reverse().join("");
}
function handle(raw){
  raw=(raw||"").trim();if(!raw)return;
  var now=Date.now();
  if(raw===last&&now-lastT<1500){lastT=now;return}
  last=raw;lastT=now;
  if(codes.indexOf(raw)>-1){
    flash("bad","¡REPETIDO! Ya lo escaneaste (#"+(codes.indexOf(raw)+1)+")");
    beep(180,400);if(navigator.vibrate)navigator.vibrate([200,100,200]);return;
  }
  codes.push(raw);save();render();
  flash("ok","✓ Paquete "+codes.length);beep(900,120);if(navigator.vibrate)navigator.vibrate(80);
}
async function tick(){
  if(!stream)return;
  var v=$("v");
  if(v.readyState>=2){
    try{
      if(detector){var r=await detector.detect(v);if(r.length)handle(r[0].rawValue)}
      else{
        var cv=tick.cv||(tick.cv=document.createElement("canvas")),w=640,h=Math.round(w*v.videoHeight/v.videoWidth);
        cv.width=w;cv.height=h;var x=cv.getContext("2d",{willReadFrequently:true});x.drawImage(v,0,0,w,h);
        var q=jsQR(x.getImageData(0,0,w,h).data,w,h);if(q)handle(q.data);
      }
    }catch(e){}
  }
  setTimeout(tick,150);
}
$("start").onclick=async function(){
  $("err").textContent="";
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"},audio:false});
    $("v").srcObject=stream;await $("v").play();
    if("BarcodeDetector" in window){try{detector=new BarcodeDetector({formats:["qr_code"]})}catch(e){detector=null}}
    $("msg").textContent="Escaneando…";$("start").textContent="Cámara activa";tick();
  }catch(e){$("err").textContent="No se pudo abrir la cámara. Da permiso en el navegador o abre este enlace directo en Chrome/Safari (no dentro de otra app)."}
};
$("add").onclick=function(){handle($("man").value);$("man").value=""};
$("list").onclick=function(e){var i=e.target.getAttribute&&e.target.getAttribute("data-i");if(i!==null&&i!==undefined){e.preventDefault();codes.splice(+i,1);save();render()}};
$("reset").onclick=function(){if(confirm("¿Borrar todo el conteo?")){codes=[];last="";save();render()}};
render();
</script>
</body>
</html>
